name: CI

on:
  pull_request:
  # também na main: push direto na branch dispara o deploy, então a suíte
  # precisa rodar mesmo quando a mudança não passa por pull request.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Prepare database
      run: bin/rails db:prepare

    - name: Run tests
      run: bin/rails test
