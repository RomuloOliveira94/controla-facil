# SQLite. Versions 3.8.0 and up are supported.
#
# Install the sqlite3 driver
#   gem install sqlite3
#
# Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
# O adapter sqlite3 do Rails 7.1 já aplica journal_mode = WAL,
# synchronous = NORMAL e foreign_keys = ON por padrão. A chave `pragmas:` só
# existe a partir do Rails 8, então não deve ser usada aqui.
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# development e production usam o formato de 3 níveis (com `primary:`) porque o
# Solid Queue mantém o banco `queue:` ao lado do primário.
#
# O banco da fila é um arquivo separado de propósito: o SQLite tem um único
# escritor por arquivo, e o polling do Solid Queue (dispatcher + worker, a cada
# 1s) disputaria o lock de escrita com as requisições da aplicação.
development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
